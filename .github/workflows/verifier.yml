name: knowledge-plane-verifier
# Scheduled Live Truth verifier: pinned SHA vs canonical remote HEAD +
# artifact blob compare. Auto-REPORT, never auto-update (ADR-004).
# Appends a history line to public/source-state-history.jsonl.tail for
# STALE threshold semantics (--previous), commits it as append-only log,
# uploads an immutable artifact, and opens an adoption issue on
# SOURCE_MOVED_CONTENT_CHANGED so pin updates stay explicit + reviewable.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify pinned sources vs remote HEAD + artifact blobs
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: node scripts/freshness.mjs --previous public/source-state-history.jsonl.tail || true
      - name: Build history tail for next run
        run: node scripts/history-tail.mjs
      - name: Commit history tail (append-only verification log)
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          git config user.name "knowledge-plane-verifier"
          git config user.email "actions@users.noreply.github.com"
          git add public/source-state-history.jsonl.tail
          if git diff --cached --quiet; then
            echo "no history changes to record"
            exit 0
          fi
          git commit -m "chore(verifier): source verification log"
          # Direct push is the convention, but branch protection may forbid
          # it for GITHUB_TOKEN. Fall back to a PR so the log is never lost
          # and the job never goes red for a push-policy reason.
          if git push origin HEAD:main; then
            echo "history log pushed direct to main"
          else
            BR="verifier/log-${{ github.run_id }}"
            git push origin "HEAD:${BR}"
            gh pr create --head "${BR}" --base main \
              --title "chore(verifier): source verification log ${{ github.run_id }}" \
              --body "Automated fallback: direct push to protected main was declined. Append-only verification log, safe to merge." \
              || echo "PR creation also failed; log preserved in artifact"
          fi
      - name: Upload immutable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "knowledge-plane-source-state-${{ github.run_id }}"
          path: |
            public/source-state.json
            public/source-state-history.jsonl.tail
      - name: Open adoption issue on semantic content change
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: node scripts/adopt-issue.mjs || true