name: knowledge-plane-verifier
# Scheduled Live Truth verifier: pinned SHA vs canonical remote HEAD +
# artifact blob compare. Auto-REPORT, never auto-update (ADR-004).
# Appends a history line to public/source-state-history.jsonl.tail for
# STALE threshold semantics (--previous), commits it as append-only log
# (pushes to stable verifier-log branch when main is PR-only since
# 2026-09-08), uploads an immutable artifact, and opens an adoption i...[truncated]
# SOURCE_MOVED_CONTENT_CHANGED so pin updates stay explicit + reviewable.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ---- restore previous threshold history from the stable ----
      # ---- verifier-log branch so --previous continuity survives  ----
      # ---- PR-only main (tail on main stopped advancing 2026-09-08). ----
      - name: Restore previous verification history (verifier-log branch)
        run: |
          git fetch origin verifier-log:verifier-log 2>/dev/null || true
          if git rev-parse --verify verifier-log >/dev/null 2>&1; then
            git checkout verifier-log -- public/source-state-history.jsonl.tail 2>/dev/null || true
          fi
      - name: Verify pinned sources vs remote HEAD + artifact blobs
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: node scripts/freshness.mjs --previous public/source-state-history.jsonl.tail || true
      - name: Build history tail for next run
        run: node scripts/history-tail.mjs
      - name: Commit history tail (append-only verification log)
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          git config user.name "knowledge-plane-verifier"
          git config user.email "actions@users.noreply.github.com"
          git add public/source-state-history.jsonl.tail
          if git diff --cached --quiet; then
            echo "no history changes to record"
            exit 0
          fi
          git commit -m "chore(verifier): source verification log"
          # Direct push is the convention, but branch protection may forbid
          # it for GITHUB_TOKEN. Fall back to the stable verifier-log
          # append-only branch so --previous keeps working and no per-run
          # branch/PR spam is created; open a PR only as the last resort.
          if git push origin HEAD:main; then
            echo "history log pushed direct to main"
          elif git push --force-with-lease origin HEAD:verifier-log; then
            echo "history log appended to verifier-log branch"
          else
            BR="verifier/log-${{ github.run_id }}"
            git push origin "HEAD:${BR}" || true
            gh pr create --head "${BR}" --base main \
              --title "chore(verifier): source verification log ${{ github.run_id }}" \
              --body "Automated fallback: direct push to protected main was declined. Append-only verification log, safe to merge." \
              || echo "PR creation also failed; log preserved in artifact"
          fi
      - name: Upload immutable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "knowledge-plane-source-state-${{ github.run_id }}"
          path: |
            public/source-state.json
            public/source-state-history.jsonl.tail
      - name: Open adoption issue on semantic content change
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: node scripts/adopt-issue.mjs || true