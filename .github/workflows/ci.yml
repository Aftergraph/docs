name: knowledge-plane-ci
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
env:
  KNOWLEDGE_ENV: ci
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npx tsc --noEmit
      - run: npm run verify:v2-ui
      - run: npm run build
      - run: node scripts/scan-public.mjs
      - name: Local smoke (built dist via preview server)
        run: |
          npx astro preview --port 4321 &
          sleep 5
          node scripts/smoke.mjs http://localhost:4321
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knowledge-plane-source-state
          path: |
            dist/build-manifest.json
            public/source-state.json
            public/status.json

  deploy:
    needs: gates
    # Automatic production deployment remains opt-in through ENABLE_DEPLOY.
    # Manual dispatch is permitted only from main, never from an arbitrary ref.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true')
    runs-on: ubuntu-latest
    environment: production
    env:
      KNOWLEDGE_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          accountId: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          command: pages deploy dist --project-name=aftergraph-docs
      - name: Production exact-head smoke
        env:
          EXPECTED_SITE_COMMIT: ${{ github.sha }}
        run: node scripts/smoke.mjs "https://docs.aftergraph.org"
