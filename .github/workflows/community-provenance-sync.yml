name: Materialize community provenance

on:
  push:
    branches: ['community/public-plane']
    paths:
      - '.github/workflows/community-provenance-sync.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: community/public-plane
      - name: Add community provenance
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('src/data/provenance.json')
          data = json.loads(p.read_text())
          data['community'] = {
            'repository': 'Aftergraph/.github',
            'commit': '651c419aade33bb32b4503ee7d2065d2f78015a0',
            'source': 'DISCUSSIONS.md + PUBLIC-ROADMAP.md + RFC-PROCESS.md',
            'semantic_version': 'V0.1 (community routing projection)',
            'evidence_cut': None,
            'canonical_owner': 'Aftergraph Community'
          }
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
      - name: Commit provenance
        run: |
          git config user.name "aftergraph-community-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/provenance.json
          git commit -m "docs: bind community page provenance"
          git push origin HEAD:community/public-plane
